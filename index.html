    <link rel="canonical" href="https://daanhessen.nl" />

    <!--
      The .ico stays first and keeps its filename: it is what crawlers probe
      at /favicon.ico, and Google's is one of them. It now carries a 48px
      entry as well as 16 and 32, which is the size Search actually wants,
      and the artwork sits on the site's own near-black rather than on
      transparency — the old mark was white on nothing, so it disappeared
      against a white results page.
    -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" href="/favicon-96.png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#07080b" />
    <meta name="msapplication-TileColor" content="#07080b" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Website Schema -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Daan Hessen Portfolio",
        "url": "https://daanhessen.nl",
        "description": "Portfolio and r\u00e9sum\u00e9 of Daan Hessen, software development student in Utrecht.",
        "author": {
          "@type": "Person",
          "name": "Daan Hessen"
        },
        "inLanguage": "en",
        "copyrightYear": "2026",
        "copyrightHolder": {
          "@type": "Person",
          "name": "Daan Hessen"
        }
      }
    </script>

    <script>
      (function() {
        var match = document.cookie.match(/(?:^|; )theme=([^;]*)/);
        var theme = match ? match[1] : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        if (theme === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <style>
      body {
        background-color: #07080b;
      }
      html[data-theme='light'] body {
        background-color: #f5f5f7;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
