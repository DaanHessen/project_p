<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wordmark lab — 10 concepts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@200;300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #07080b;
        --fg: #e8ebf0;
        --fg-muted: #9aa3b2;
        --fg-faint: #5a6472;
        --accent: #d9a441;
        --rule: rgba(154, 163, 178, 0.14);
        --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo,
          "Courier New", monospace;
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--bg);
        color: var(--fg-muted);
        font-family: var(--font-mono);
        font-size: 0.875rem;
        line-height: 1.7;
        letter-spacing: 0.01em;
        -webkit-font-smoothing: antialiased;
        padding: 3rem 1.5rem 6rem;
      }

      .lab-head {
        max-width: 70rem;
        margin: 0 auto 3rem;
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 1rem;
        border-bottom: 1px solid var(--rule);
        padding-bottom: 1rem;
      }

      .lab-head h1 {
        font-size: 0.8125rem;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: lowercase;
        color: var(--fg);
      }

      .lab-head p {
        font-size: 0.75rem;
        color: var(--fg-faint);
      }

      .lab-head button {
        margin-left: auto;
      }

      button {
        font-family: inherit;
        font-size: 0.6875rem;
        letter-spacing: 0.12em;
        text-transform: lowercase;
        color: var(--accent);
        background: none;
        border: 1px solid rgba(217, 164, 65, 0.45);
        padding: 0.35rem 0.9rem;
        cursor: pointer;
        transition:
          border-color 0.15s ease,
          background 0.15s ease;
      }

      button:hover {
        border-color: var(--accent);
        background: rgba(217, 164, 65, 0.08);
      }

      .grid {
        max-width: 70rem;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 2.5rem;
      }

      .card {
        border: 1px solid var(--rule);
      }

      .card__bar {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0.6rem 1rem;
        border-bottom: 1px solid var(--rule);
        font-size: 0.6875rem;
      }

      .card__num {
        color: var(--accent);
      }

      .card__name {
        color: var(--fg);
        letter-spacing: 0.08em;
      }

      .card__note {
        color: var(--fg-faint);
        margin-left: auto;
        text-align: right;
      }

      .card__stage {
        min-height: 22rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2rem;
        padding: 3rem 1.5rem;
        overflow: hidden;
      }

      .card__actions {
        display: flex;
        justify-content: center;
        gap: 0.5rem;
        padding: 0 0 1.25rem;
      }

      .tagline {
        color: var(--fg-muted);
        font-size: 0.8125rem;
        letter-spacing: 0.16em;
        text-transform: lowercase;
      }

      .intro {
        max-width: 58ch;
        color: var(--fg-faint);
        font-size: 0.78125rem;
        line-height: 1.8;
        text-align: center;
      }

      .mark {
        margin: 0;
        font-family: var(--font-mono);
        line-height: 1;
        color: var(--fg);
        white-space: pre;
        text-align: center;
        font-kerning: none;
      }

      .mark .row {
        display: block;
      }

      /* 1 — solid slab ---------------------------------------------------- */
      .c1 .mark {
        font-size: clamp(0.32rem, 0.78vw, 0.62rem);
        letter-spacing: 0;
      }
      .c1 .row {
        clip-path: inset(0 100% 0 0);
        animation: wipe-right 0.5s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
        animation-delay: calc(var(--i) * 0.045s);
      }
      @keyframes wipe-right {
        to {
          clip-path: inset(0 0 0 0);
        }
      }

      /* 2 — half-block condensed ------------------------------------------ */
      .c2 .mark {
        font-size: clamp(0.36rem, 0.86vw, 0.7rem);
        position: relative;
      }
      .c2 .row {
        opacity: 0;
        transform: translateY(8px);
        animation: rise 0.24s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
        animation-delay: calc(var(--i) * 0.05s);
      }
      @keyframes rise {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .c2 .mark::after {
        content: "";
        position: absolute;
        inset: -0.4em 0;
        pointer-events: none;
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(232, 235, 240, 0.12) 45%,
          rgba(232, 235, 240, 0.22) 50%,
          rgba(232, 235, 240, 0.12) 55%,
          transparent 100%
        );
        mix-blend-mode: overlay;
        transform: translateX(-120%);
        animation: sheen 4.5s linear 1s infinite;
      }
      @keyframes sheen {
        to {
          transform: translateX(120%);
        }
      }

      /* 3 — braille micro -------------------------------------------------- */
      .c3 .mark {
        font-size: clamp(1.6rem, 5vw, 3.4rem);
        line-height: 1.05;
        letter-spacing: 0.02em;
      }
      .c3 .ch {
        display: inline-block;
        animation: wave 2.6s ease-in-out infinite;
        animation-delay: calc(var(--j) * 0.055s);
      }
      @keyframes wave {
        0%,
        100% {
          transform: translateY(0);
          opacity: 0.85;
        }
        50% {
          transform: translateY(-0.06em);
          opacity: 1;
        }
      }

      /* 4 — outline / box-drawing ----------------------------------------- */
      .c4 .mark {
        font-size: clamp(0.34rem, 0.82vw, 0.66rem);
        color: var(--fg);
      }
      .c4 .mark {
        clip-path: inset(0 100% 0 0);
        animation: wipe-right 1.1s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }

      /* 5 — shaded extrude ------------------------------------------------ */
      .c5 .stack {
        position: relative;
        display: inline-block;
      }
      .c5 .mark {
        font-size: clamp(0.32rem, 0.78vw, 0.62rem);
      }
      .c5 .mark--shadow {
        position: absolute;
        left: 0.7em;
        top: 0.34em;
        color: rgba(154, 163, 178, 0.3);
        z-index: 0;
      }
      .c5 .mark--face {
        position: relative;
        z-index: 1;
        background: linear-gradient(
          100deg,
          #cfd5df 0%,
          #cfd5df 38%,
          #ffffff 50%,
          #cfd5df 62%,
          #cfd5df 100%
        );
        background-size: 300% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: shine 6s linear infinite;
      }
      @keyframes shine {
        from {
          background-position: 120% 0;
        }
        to {
          background-position: -120% 0;
        }
      }

      /* 6 — dot matrix ---------------------------------------------------- */
      .c6 .mark {
        font-size: clamp(0.34rem, 0.8vw, 0.62rem);
        line-height: 1.15;
      }
      .c6 .off {
        color: rgba(154, 163, 178, 0.16);
      }
      .c6 .on {
        color: var(--fg);
        display: inline-block;
        opacity: 0;
        transform: scale(0.2);
        animation: pop 0.34s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        animation-delay: calc(var(--d) * 1ms);
      }
      @keyframes pop {
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      /* 7 — terminal prompt ------------------------------------------------ */
      .c7 .term {
        font-size: clamp(1rem, 2.6vw, 1.9rem);
        letter-spacing: 0.02em;
        line-height: 1.9;
        text-align: left;
      }
      .c7 .dim {
        color: var(--fg-faint);
      }
      .c7 .accent {
        color: var(--accent);
      }
      .c7 .out {
        color: var(--fg);
        font-weight: 500;
        letter-spacing: 0.06em;
      }
      .caret {
        display: inline-block;
        width: 0.55em;
        height: 1.05em;
        background: var(--fg);
        vertical-align: -0.16em;
        animation: blink 1.05s steps(1) infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      /* 8 — scramble decode ------------------------------------------------ */
      .c8 .scramble {
        font-size: clamp(1.4rem, 4.4vw, 3rem);
        font-weight: 300;
        letter-spacing: 0.34em;
        text-indent: 0.34em;
        color: var(--fg);
        white-space: pre;
      }

      /* 9 — stacked lowercase giant ---------------------------------------- */
      .c9 .stackword {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 0.02em;
      }
      .c9 .line {
        overflow: hidden;
        line-height: 0.86;
      }
      .c9 .word {
        display: block;
        font-size: clamp(2.4rem, 9vw, 6.5rem);
        font-weight: 600;
        letter-spacing: -0.045em;
        color: var(--fg);
        transform: translateY(105%);
        animation: liftup 0.66s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        animation-delay: calc(var(--i) * 0.09s);
      }
      @keyframes liftup {
        to {
          transform: translateY(0);
        }
      }
      .c9 .rule {
        width: 100%;
        height: 1px;
        background: var(--rule);
        margin-top: 0.7rem;
        transform: scaleX(0);
        transform-origin: left;
        animation: growx 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
      }
      @keyframes growx {
        to {
          transform: scaleX(1);
        }
      }
      .c9 .meta {
        display: flex;
        justify-content: space-between;
        width: 100%;
        font-size: 0.6875rem;
        letter-spacing: 0.18em;
        color: var(--fg-faint);
        margin-top: 0.5rem;
        opacity: 0;
        animation: fadein 0.5s ease 0.7s forwards;
      }
      @keyframes fadein {
        to {
          opacity: 1;
        }
      }

      /* 10 — field carve ---------------------------------------------------- */
      .c10 .mark {
        font-size: clamp(0.34rem, 0.82vw, 0.66rem);
        color: rgba(154, 163, 178, 0.3);
      }
      .c10 .on {
        color: var(--fg);
      }

      @media (max-width: 40rem) {
        .card__note {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="lab-head">
      <h1>wordmark lab</h1>
      <p>10 replacements for the hero title — every one animates</p>
      <button id="replay-all">replay all</button>
    </div>

    <div class="grid" id="grid"></div>

    <script>
      /* ---------------------------------------------------------------- font
         One 5x7 bitmap per glyph. Every block/dot/braille/outline concept
         below is a different renderer over this same source, so they stay
         consistent with each other. */
      const F = {
        A: ["01110", "10001", "10001", "11111", "10001", "10001", "10001"],
        D: ["11110", "10001", "10001", "10001", "10001", "10001", "11110"],
        E: ["11111", "10000", "10000", "11110", "10000", "10000", "11111"],
        H: ["10001", "10001", "10001", "11111", "10001", "10001", "10001"],
        N: ["10001", "11001", "11001", "10101", "10011", "10011", "10001"],
        S: ["01111", "10000", "10000", "01110", "00001", "00001", "11110"],
      };

      const TEXT = "DAAN HESSEN";

      /** Build a 0/1 grid for TEXT. gap = columns between letters. */
      function bitmap(gap = 1, wordGap = 3) {
        const rows = Array.from({ length: 7 }, () => []);
        [...TEXT].forEach((ch, idx) => {
          if (idx > 0) {
            const n = ch === " " || TEXT[idx - 1] === " " ? 0 : gap;
            for (let r = 0; r < 7; r++)
              for (let g = 0; g < n; g++) rows[r].push(0);
          }
          if (ch === " ") {
            for (let r = 0; r < 7; r++)
              for (let g = 0; g < wordGap; g++) rows[r].push(0);
            return;
          }
          const glyph = F[ch];
          for (let r = 0; r < 7; r++)
            for (let c = 0; c < 5; c++) rows[r].push(+glyph[r][c]);
        });
        return rows;
      }

      /** Widen a grid horizontally so letters are not skinny in a mono cell. */
      function widen(grid, n = 2) {
        return grid.map((row) => row.flatMap((v) => Array(n).fill(v)));
      }

      const at = (g, r, c) => (g[r] && g[r][c]) || 0;

      /* ------------------------------------------------------------ renderers */

      function renderSolid(g, on = "█", off = " ") {
        return g.map((row) => row.map((v) => (v ? on : off)).join(""));
      }

      function renderHalf(g) {
        const out = [];
        for (let r = 0; r < g.length; r += 2) {
          let line = "";
          for (let c = 0; c < g[r].length; c++) {
            const t = at(g, r, c);
            const b = at(g, r + 1, c);
            line += t && b ? "█" : t ? "▀" : b ? "▄" : " ";
          }
          out.push(line);
        }
        return out;
      }

      function renderBraille(g) {
        const dots = [
          [0, 3],
          [1, 4],
          [2, 5],
          [6, 7],
        ];
        const out = [];
        for (let r = 0; r < 8; r += 4) {
          let line = "";
          for (let c = 0; c < g[0].length; c += 2) {
            let bits = 0;
            for (let dr = 0; dr < 4; dr++)
              for (let dc = 0; dc < 2; dc++)
                if (at(g, r + dr, c + dc)) bits |= 1 << dots[dr][dc];
            line += String.fromCharCode(0x2800 + bits);
          }
          out.push(line);
        }
        return out;
      }

      function renderOutline(g) {
        const isEdge = (r, c) =>
          at(g, r, c) &&
          (!at(g, r - 1, c) ||
            !at(g, r + 1, c) ||
            !at(g, r, c - 1) ||
            !at(g, r, c + 1));
        const key = {
          "": "·",
          U: "│",
          D: "│",
          L: "─",
          R: "─",
          UD: "│",
          LR: "─",
          DR: "┌",
          DL: "┐",
          UR: "└",
          UL: "┘",
          UDR: "├",
          UDL: "┤",
          DLR: "┬",
          ULR: "┴",
          UDLR: "┼",
        };
        return g.map((row, r) =>
          row
            .map((_, c) => {
              if (!isEdge(r, c)) return " ";
              let k = "";
              if (isEdge(r - 1, c)) k += "U";
              if (isEdge(r + 1, c)) k += "D";
              if (isEdge(r, c - 1)) k += "L";
              if (isEdge(r, c + 1)) k += "R";
              return key[k] || "·";
            })
            .join(""),
        );
      }

      function renderShade(g) {
        return g.map((row, r) =>
          row
            .map((v, c) => {
              if (!v) return " ";
              const n =
                at(g, r - 1, c) +
                at(g, r + 1, c) +
                at(g, r, c - 1) +
                at(g, r, c + 1);
              return n === 4 ? "█" : n === 3 ? "▓" : n === 2 ? "▒" : "░";
            })
            .join(""),
        );
      }

      /* --------------------------------------------------------------- utils */

      const el = (tag, cls, html) => {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        if (html !== undefined) n.innerHTML = html;
        return n;
      };

      const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");

      function rowsHTML(lines) {
        return lines
          .map(
            (l, i) => `<span class="row" style="--i:${i}">${esc(l)}</span>`,
          )
          .join("");
      }

      const TAGLINE = "software developer, hilversum";

      /* --------------------------------------------------------------- cards */

      const concepts = [
        {
          name: "solid slab",
          note: "compact 5×7 block face · per-row wipe",
          build() {
            const wrap = el("div", "c1");
            wrap.appendChild(
              el("pre", "mark", rowsHTML(renderSolid(widen(bitmap())))),
            );
            return wrap;
          },
        },
        {
          name: "half-block condense",
          note: "▀▄ half cells, 4 rows tall · stagger + sheen",
          build() {
            const wrap = el("div", "c2");
            wrap.appendChild(
              el("pre", "mark", rowsHTML(renderHalf(widen(bitmap())))),
            );
            return wrap;
          },
        },
        {
          name: "braille micro",
          note: "2×4 braille cells, 2 rows · per-glyph wave",
          build() {
            const wrap = el("div", "c3");
            const lines = renderBraille(bitmap(1, 2));
            let j = 0;
            const html = lines
              .map(
                (l) =>
                  `<span class="row">${[...l]
                    .map(
                      (ch) =>
                        `<span class="ch" style="--j:${j++}">${esc(ch)}</span>`,
                    )
                    .join("")}</span>`,
              )
              .join("");
            wrap.appendChild(el("pre", "mark", html));
            return wrap;
          },
        },
        {
          name: "box outline",
          note: "hollow letters in box-drawing chars · draw-on",
          build() {
            const wrap = el("div", "c4");
            wrap.appendChild(
              el(
                "pre",
                "mark",
                esc(renderOutline(widen(bitmap(2, 4), 3)).join("\n")),
              ),
            );
            return wrap;
          },
        },
        {
          name: "shaded extrude",
          note: "░▒▓ depth + offset drop face · light sweep",
          build() {
            const wrap = el("div", "c5");
            const stack = el("div", "stack");
            const lines = renderShade(widen(bitmap()));
            const solid = renderSolid(widen(bitmap()));
            stack.appendChild(
              el("pre", "mark mark--shadow", esc(lines.join("\n"))),
            );
            stack.appendChild(
              el("pre", "mark mark--face", esc(solid.join("\n"))),
            );
            wrap.appendChild(stack);
            return wrap;
          },
        },
        {
          name: "dot matrix",
          note: "LED grid, off-dots visible · dots pop in",
          build() {
            const wrap = el("div", "c6");
            const g = bitmap(2, 4);
            const html = g
              .map(
                (row, r) =>
                  `<span class="row">${row
                    .map((v, c) =>
                      v
                        ? `<span class="on" style="--d:${
                            c * 7 + r * 12 + Math.random() * 60
                          }">●</span>`
                        : `<span class="off">·</span>`,
                    )
                    .join(" ")}</span>`,
              )
              .join("");
            wrap.appendChild(el("pre", "mark", html));
            return wrap;
          },
        },
        {
          name: "terminal prompt",
          note: "typed shell session · caret blink",
          build() {
            const wrap = el("div", "c7");
            const pre = el("pre", "term");
            wrap.appendChild(pre);
            const script = [
              { cls: "dim", text: "daanhessen.nl " },
              { cls: "accent", text: "~ " },
              { cls: "dim", text: "$ " },
              { cls: "", text: "whoami\n" },
              { cls: "out", text: "daan hessen\n" },
              { cls: "dim", text: "daanhessen.nl " },
              { cls: "accent", text: "~ " },
              { cls: "dim", text: "$ " },
            ];
            wrap.replay = () => {
              pre.innerHTML = "";
              let si = 0,
                ci = 0,
                span = null;
              const caret = el("span", "caret");
              const step = () => {
                if (!wrap.isConnected) return;
                if (si >= script.length) {
                  pre.appendChild(caret);
                  return;
                }
                const part = script[si];
                if (ci === 0) {
                  span = el("span", part.cls);
                  pre.appendChild(span);
                }
                span.textContent += part.text[ci++];
                if (ci >= part.text.length) {
                  si++;
                  ci = 0;
                }
                wrap.timer = setTimeout(step, part.cls === "out" ? 55 : 42);
              };
              step();
            };
            return wrap;
          },
        },
        {
          name: "scramble decode",
          note: "plain letterspaced type resolving out of noise",
          build() {
            const wrap = el("div", "c8");
            const node = el("div", "scramble");
            wrap.appendChild(node);
            const target = "DAAN HESSEN";
            const pool = "▚▞#%&$@/\\|<>*+=-_ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            wrap.replay = () => {
              let frame = 0;
              const settle = [...target].map(
                (_, i) => 8 + i * 3 + Math.floor(Math.random() * 10),
              );
              const tick = () => {
                if (!wrap.isConnected) return;
                node.textContent = [...target]
                  .map((ch, i) => {
                    if (ch === " ") return " ";
                    if (frame >= settle[i]) return ch;
                    return pool[Math.floor(Math.random() * pool.length)];
                  })
                  .join("");
                if (frame++ < Math.max(...settle))
                  wrap.timer = setTimeout(tick, 45);
              };
              tick();
            };
            return wrap;
          },
        },
        {
          name: "stacked lowercase",
          note: "no ASCII — heavy mono type, masked rise",
          build() {
            const wrap = el("div", "c9");
            wrap.innerHTML = `
              <div class="stackword">
                <span class="line"><span class="word" style="--i:0">daan</span></span>
                <span class="line"><span class="word" style="--i:1">hessen</span></span>
                <span class="rule"></span>
              </div>`;
            return wrap;
          },
        },
        {
          name: "field carve",
          note: "name carved out of a live churning ASCII field",
          build() {
            const wrap = el("div", "c10");
            const pre = el("pre", "mark");
            wrap.appendChild(pre);
            const g = widen(bitmap(2, 4));
            const dense = "@#%&B8WM";
            const sparse = ".,'`:;-~^\"";
            wrap.replay = () => {
              const tick = () => {
                if (!wrap.isConnected) return;
                pre.innerHTML = g
                  .map(
                    (row) =>
                      `<span class="row">${row
                        .map((v) =>
                          v
                            ? `<span class="on">${
                                dense[(Math.random() * dense.length) | 0]
                              }</span>`
                            : sparse[(Math.random() * sparse.length) | 0],
                        )
                        .join("")}</span>`,
                  )
                  .join("");
                wrap.timer = setTimeout(tick, 110);
              };
              tick();
            };
            return wrap;
          },
        },
      ];

      /* ---------------------------------------------------------------- mount */

      const grid = document.getElementById("grid");
      const slots = [];

      concepts.forEach((concept, i) => {
        const card = el("section", "card");
        const bar = el("div", "card__bar");
        bar.appendChild(
          el("span", "card__num", String(i + 1).padStart(2, "0")),
        );
        bar.appendChild(el("span", "card__name", concept.name));
        bar.appendChild(el("span", "card__note", concept.note));
        card.appendChild(bar);

        const stage = el("div", "card__stage");
        const host = el("div");
        stage.appendChild(host);
        stage.appendChild(el("p", "tagline", TAGLINE));
        stage.appendChild(
          el(
            "p",
            "intro",
            "Just a guy studying HBO-ICT at the University of Applied Sciences Utrecht. I like solving problems and learning new things.",
          ),
        );
        card.appendChild(stage);

        const actions = el("div", "card__actions");
        const btn = el("button", null, "replay");
        actions.appendChild(btn);
        card.appendChild(actions);

        const slot = {
          concept,
          host,
          mount() {
            if (slot.node) {
              clearTimeout(slot.node.timer);
              slot.node.remove();
            }
            const node = concept.build();
            host.appendChild(node);
            slot.node = node;
            if (node.replay) node.replay();
          },
        };
        btn.addEventListener("click", slot.mount);
        slots.push(slot);
        grid.appendChild(card);
        slot.mount();
      });

      document
        .getElementById("replay-all")
        .addEventListener("click", () => slots.forEach((s) => s.mount()));
    </script>
  </body>
</html>
